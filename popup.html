<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Rerun</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>ChatGPT Rerun</h1>
          <p id="statusLine">Stopped</p>
        </div>
        <span id="statusDot" aria-hidden="true"></span>
      </header>

      <section>
        <div class="grid two">
          <label>Owner<input id="owner" autocomplete="off" placeholder="Kaetaeru" /></label>
          <label>Repository<input id="repo" autocomplete="off" placeholder="project" /></label>
        </div>
        <div class="grid two">
          <label>Branch<input id="branch" autocomplete="off" value="main" /></label>
          <label>Max sends<input id="maxRuns" type="number" min="1" max="100" /></label>
        </div>
        <label>Control file<input id="path" autocomplete="off" /></label>
        <label>Resume prompt<textarea id="resumePrompt" rows="4"></textarea></label>
        <div class="grid two">
          <label>Poll seconds<input id="pollIntervalSeconds" type="number" min="5" /></label>
          <label>Retry after seconds<input id="retryDelaySeconds" type="number" min="10" /></label>
        </div>
        <div class="grid two">
          <label>Retries / sequence<input id="maxRetriesPerSequence" type="number" min="0" max="10" /></label>
          <label>GitHub token <span class="muted">optional</span><input id="githubToken" type="password" autocomplete="off" /></label>
        </div>
        <p class="hint">같은 sequence가 그대로 남아 있고 ChatGPT가 유휴 상태면 Retry after 이후 재개 프롬프트를 다시 보냅니다. 토큰이 없으면 GitHub polling은 최소 60초입니다.</p>
      </section>

      <section class="runtime">
        <div><span>Run</span><strong id="runId">-</strong></div>
        <div><span>Sequence</span><strong id="sequence">-</strong></div>
        <div><span>GitHub status</span><strong id="githubStatus">-</strong></div>
        <div><span>Sent</span><strong id="runCount">0</strong></div>
        <div><span>Same-sequence retries</span><strong id="retryCount">0</strong></div>
        <div><span>Last sent</span><strong id="lastSentAt">-</strong></div>
        <div><span>Rate remaining</span><strong id="rateLimit">-</strong></div>
      </section>

      <p id="errorBox" class="error" hidden></p>

      <footer>
        <button id="save" class="secondary">Save</button>
        <button id="stop" class="danger">Stop</button>
        <button id="start" class="primary">Start on this tab</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
