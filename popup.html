<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ChatGPT Rerun V2</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Rerun V2</h1>
          <p>Goal Runner</p>
        </div>
        <span id="statusBadge">Idle</span>
      </header>

      <section class="card">
        <label>Repository
          <input id="repository" placeholder="owner/repo" autocomplete="off" />
        </label>
        <label>Branch
          <input id="branch" placeholder="main" autocomplete="off" />
        </label>
        <label>Goal
          <textarea id="goal" rows="6" placeholder="달성할 최종 목표를 적으세요."></textarea>
        </label>
        <label>Acceptance <span>optional</span>
          <textarea id="acceptance" rows="4" placeholder="완료 조건. 비우면 저장소의 공식 acceptance와 관련 검증을 사용합니다."></textarea>
        </label>
        <label>Canonical authority <span>optional</span>
          <textarea id="authorityPaths" rows="3" placeholder="예: AGENTS.md, docs/V1_PLAN.md, issue #123"></textarea>
        </label>
        <p class="hint">Rerun은 별도 프로젝트 PLAN을 만들지 않습니다. 저장소의 공식 규칙·기획이 Goal보다 우선합니다.</p>
      </section>

      <section class="runtime card">
        <div><span>Status</span><strong id="runtimeStatus">Idle</strong></div>
        <div><span>Iteration</span><strong id="iteration">0</strong></div>
        <div><span>Run</span><strong id="runId">-</strong></div>
        <div><span>Approval</span><strong id="approval">-</strong></div>
        <div class="wide"><span>Last checkpoint</span><strong id="checkpoint">-</strong></div>
      </section>

      <p id="errorBox" class="error" hidden></p>

      <footer>
        <button id="save" class="secondary">Save</button>
        <button id="pause" class="secondary">Pause</button>
        <button id="stop" class="danger">Stop</button>
        <button id="start" class="primary">Start</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
